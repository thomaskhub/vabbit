name: release
# Push a tag like v0.1.0 (or run this workflow by hand with a tag name) to publish
# binaries, the systemd unit, the installer and checksums as a GitHub release (used by
# scripts/install.sh). A hand run creates the tag on the commit it runs from.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0 or v0.1.0-rc.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - name: Build
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          case "$VERSION" in v[0-9]*) ;; *) echo "tag must look like v0.1.0" >&2; exit 1 ;; esac
          mkdir -p out
          (cd edge && bun install --frozen-lockfile && bun run build)
          cp edge/dist/edge-script.js client/internal/deploy/edgescript/bundle/
          # Linux and Windows run devices and admin commands; macOS is for admins (deploy, keys, devices).
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            ext=""; [ "${target%/*}" = windows ] && ext=.exe
            (cd client && CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath \
              -ldflags="-s -w -X main.version=$VERSION" -o ../out/vabbit-${target%/*}-${target#*/}$ext ./cmd/vabbit)
          done
          python3 scripts/fetch_wintun.py out   # wintun-{amd64,arm64}.dll for Windows
          cp packaging/vabbit@.service scripts/install.sh scripts/install.ps1 out/
          (cd out && sha256sum * > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # Tags with a suffix (v0.1.0-rc.1) become pre-releases, so "latest" skips them.
        # A release made by hand in the GitHub UI just gets the files attached.
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            exit 0
          fi
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes $pre

name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun run build:worker

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: shellcheck ../scripts/install.sh
      - name: Build binaries (with the edge script for vabbit deploy)
        run: |
          (cd ../edge && bun install --frozen-lockfile && bun run build)
          cp ../edge/dist/edge-script.js internal/deploy/edgescript/bundle/
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -ldflags="-s -w" \
              -o dist/vabbit-${target%/*}-${target#*/} ./cmd/vabbit
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vabbit
          path: client/dist/

  windows:
    # Unit tests on Windows, then a real Wintun adapter run as a Windows service
    # (scripts/windows-smoke.ps1), installed with install.ps1.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - name: Unit tests
        shell: bash
        run: |
          cd client && go vet ./...
          # Failures as annotations: job logs are not readable from every place this repo is worked on.
          if ! go test ./... > ../test.log 2>&1; then
            cat ../test.log
            grep -E -B2 -A12 -- '--- FAIL|^FAIL|panic:' ../test.log | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=windows unit tests::/'
            echo
            exit 1
          fi
          cat ../test.log
      - name: Build and collect the release files
        shell: bash
        run: |
          mkdir -p out
          (cd client && CGO_ENABLED=0 go build -trimpath -o ../out/vabbit-windows-amd64.exe ./cmd/vabbit)
          python scripts/fetch_wintun.py out
          (cd out && sha256sum vabbit-windows-amd64.exe wintun-amd64.dll > SHA256SUMS)
          (cd edge && bun install --frozen-lockfile)
      - name: Smoke test (service, adapter, status, firewall, hosts, leave)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows-smoke.ps1 -Assets "%CD%\out"

  sbom:
    # Keeps sbom/ in step with the dependencies and publishes it as an artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.8.0
      - run: ./scripts/sbom.sh
      - name: SBOM is up to date
        run: git diff --exit-code sbom/ || (echo "Run scripts/sbom.sh and commit sbom/" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  e2e:
    # Real WireGuard tunnels through emulated home NATs (network namespaces).
    runs-on: ubuntu-latest
    needs: [edge, client]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - run: cd edge && bun install --frozen-lockfile
      - run: sudo env "PATH=$PATH" "HOME=$HOME" "GOPATH=$(go env GOPATH)" "GOCACHE=$(go env GOCACHE)" ./scripts/e2e-nat.sh

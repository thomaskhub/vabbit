name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun run build:worker

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: shellcheck ../scripts/install.sh
      - name: Build Linux binaries
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o dist/vabbit-linux-$arch ./cmd/vabbit
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vabbit-linux
          path: client/dist/

  deploy:
    runs-on: ubuntu-latest
    needs: [edge]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v5
        with:
          go-version-file: deploy/go.mod
      - run: cd edge && bun install --frozen-lockfile
      - run: cd deploy && test -z "$(gofmt -l .)" && go vet ./... && go test ./...
      - run: make deploy
      - uses: actions/upload-artifact@v4
        with:
          name: vabbit-deploy
          path: dist/vabbit-deploy

  sbom:
    # Keeps sbom/ in step with the dependencies and publishes it as an artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.8.0
      - run: ./scripts/sbom.sh
      - name: SBOM is up to date
        run: git diff --exit-code sbom/ || (echo "Run scripts/sbom.sh and commit sbom/" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  e2e:
    # Real WireGuard tunnels through emulated home NATs (network namespaces).
    runs-on: ubuntu-latest
    needs: [edge, client]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - run: cd edge && bun install --frozen-lockfile
      - run: sudo env "PATH=$PATH" "HOME=$HOME" "GOPATH=$(go env GOPATH)" "GOCACHE=$(go env GOCACHE)" ./scripts/e2e-nat.sh

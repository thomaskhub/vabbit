<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Vabbit: Sleek. Fast. Secure. The WireGuard rabbit.">
<defs><radialGradient id="bgb" cx="0.5" cy="0.35" r="0.75"><stop offset="0" stop-color="#123a66"/><stop offset="1" stop-color="#06122a"/></radialGradient></defs>
<rect width="1200" height="600" fill="url(#bgb)"/>
<g fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.16"><path d="M41 40 H269 L292 63 H359"/><circle cx="359" cy="63" r="3" fill="#38bdf8"/><path d="M1159 40 H931 L908 63 H841"/><circle cx="841" cy="63" r="3" fill="#38bdf8"/><path d="M83 86 H256 L279 63 H346"/><circle cx="346" cy="63" r="3" fill="#38bdf8"/><path d="M1117 86 H944 L921 63 H854"/><circle cx="854" cy="63" r="3" fill="#38bdf8"/><path d="M105 132 H318 L341 109 H408"/><circle cx="408" cy="109" r="3" fill="#38bdf8"/><path d="M1095 132 H882 L859 109 H792"/><circle cx="792" cy="109" r="3" fill="#38bdf8"/><path d="M46 178 H324 L347 155 H414"/><circle cx="414" cy="155" r="3" fill="#38bdf8"/><path d="M1154 178 H876 L853 155 H786"/><circle cx="786" cy="155" r="3" fill="#38bdf8"/><path d="M116 224 H314 L337 201 H404"/><circle cx="404" cy="201" r="3" fill="#38bdf8"/><path d="M1084 224 H886 L863 201 H796"/><circle cx="796" cy="201" r="3" fill="#38bdf8"/><path d="M4 270 H261 L284 293 H351"/><circle cx="351" cy="293" r="3" fill="#38bdf8"/><path d="M1196 270 H939 L916 293 H849"/><circle cx="849" cy="293" r="3" fill="#38bdf8"/><path d="M53 316 H258 L281 293 H348"/><circle cx="348" cy="293" r="3" fill="#38bdf8"/><path d="M1147 316 H942 L919 293 H852"/><circle cx="852" cy="293" r="3" fill="#38bdf8"/><path d="M11 362 H320 L343 385 H410"/><circle cx="410" cy="385" r="3" fill="#38bdf8"/><path d="M1189 362 H880 L857 385 H790"/><circle cx="790" cy="385" r="3" fill="#38bdf8"/><path d="M7 408 H355 L378 385 H445"/><circle cx="445" cy="385" r="3" fill="#38bdf8"/><path d="M1193 408 H845 L822 385 H755"/><circle cx="755" cy="385" r="3" fill="#38bdf8"/><path d="M28 454 H330 L353 431 H420"/><circle cx="420" cy="431" r="3" fill="#38bdf8"/><path d="M1172 454 H870 L847 431 H780"/><circle cx="780" cy="431" r="3" fill="#38bdf8"/><path d="M73 500 H324 L347 523 H414"/><circle cx="414" cy="523" r="3" fill="#38bdf8"/><path d="M1127 500 H876 L853 523 H786"/><circle cx="786" cy="523" r="3" fill="#38bdf8"/><path d="M6 546 H278 L301 523 H368"/><circle cx="368" cy="523" r="3" fill="#38bdf8"/><path d="M1194 546 H922 L899 523 H832"/><circle cx="832" cy="523" r="3" fill="#38bdf8"/></g>
<svg x="440" y="30" width="340" height="303.8" viewBox="20 20 940 840">
  <defs>
    <linearGradient id="teal" gradientUnits="userSpaceOnUse" x1="300" y1="250" x2="800" y2="800">
      <stop offset="0" stop-color="#3fdca0"/><stop offset="1" stop-color="#14a38c"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#43dfa2"/><stop offset="1" stop-color="#22b49c"/>
    </linearGradient>
    <linearGradient id="earDark" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#1fae8c"/><stop offset="1" stop-color="#138a87"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#3fdca0"/><stop offset="1" stop-color="#19a990"/>
    </linearGradient>
    <linearGradient id="chest" gradientUnits="userSpaceOnUse" x1="0" y1="450" x2="0" y2="700">
      <stop offset="0" stop-color="#1d6fe0" stop-opacity="0"/><stop offset="0.5" stop-color="#1d6fe0" stop-opacity="0.7"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e5fd6"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#e0f7ff"/><stop offset="0.6" stop-color="#7dd3fc"/><stop offset="1" stop-color="#38bdf8"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="bodyShape" d="M650 306 C 540 326, 400 348, 318 405 C 262 445, 242 510, 256 580 C 270 640, 320 698, 380 720 L 470 704 C 560 692, 650 652, 722 600 C 762 570, 762 540, 746 520 L 640 520 Z"/>
    <path id="headShape" d="M640 300 C 700 284, 770 288, 802 300 C 852 330, 902 390, 936 446 C 912 470, 880 490, 846 500 C 780 512, 700 516, 640 520 C 608 470, 608 350, 640 300 Z"/>
    <clipPath id="bodyClip"><use href="#bodyShape"/><use href="#headShape"/></clipPath>
  </defs>
  <g id="rabbit" stroke-linejoin="round">
    <!-- shield (behind the body) -->
    <path d="M372 722 C 420 790, 462 822, 512 844 C 602 802, 692 722, 748 556" fill="none" stroke="url(#blue)" stroke-width="24"/>
    <!-- circuit trace -->
    <path d="M268 450 L268 322 L432 290" fill="none" stroke="#2fc79a" stroke-width="22"/>
    <!-- tail -->
    <circle cx="205" cy="486" r="46" fill="#1aa38a"/>
    <!-- hind leg -->
    <path d="M272 556 C 240 610, 200 650, 150 670 C 118 722, 80 782, 46 824 L 152 812 C 192 760, 252 722, 332 702 Z" fill="url(#teal)" stroke="#0b1f3a" stroke-width="8" paint-order="stroke"/>
    <!-- body -->
    <use href="#bodyShape" fill="url(#teal)" stroke="#0b1f3a" stroke-width="8" paint-order="stroke"/>
    <!-- ears -->
    <path d="M256 104 L 296 120 C 430 175, 570 245, 712 318 L 668 344 C 540 280, 410 215, 286 172 Z" fill="url(#earDark)" stroke="#0b1f3a" stroke-width="6" paint-order="stroke"/>
    <path d="M256 104 L 296 120 C 430 175, 570 245, 712 318 L 698 327 C 560 258, 420 190, 272 140 Z" fill="url(#ear)"/>
    <path d="M352 34 L 384 62 C 520 140, 660 214, 794 292 L 750 318 C 622 240, 500 170, 368 112 Z" fill="url(#ear)" stroke="#0b1f3a" stroke-width="6" paint-order="stroke"/>
    <!-- head -->
    <use href="#headShape" fill="url(#teal)"/>
    <path d="M770 386 C 792 390, 818 400, 840 416 C 814 420, 790 412, 770 386 Z" fill="#0b1f3a"/>
    <g clip-path="url(#bodyClip)">
      <path d="M580 380 L 960 380 L 960 760 L 430 720 Z" fill="url(#chest)"/>
      <path d="M292 428 C 248 510, 256 620, 340 712 L 376 708 C 304 626, 296 530, 330 440 Z" fill="#4be3a8" opacity="0.55"/>
      <path d="M330 440 C 296 530, 304 626, 376 708" fill="none" stroke="#0b1f3a" stroke-width="6" opacity="0.8"/>
    </g>
    <!-- front legs -->
    <path d="M712 640 C 790 650, 850 700, 880 766 L 842 762 C 810 722, 770 696, 712 682 Z" fill="url(#blue)"/>
    <!-- toggle -->
    <rect x="400" y="500" width="216" height="110" rx="55" fill="#0f2547" stroke="#38bdf8" stroke-width="14" filter="url(#glow)"/>
    <circle cx="560" cy="555" r="40" fill="url(#knob)" filter="url(#glow)"/>
  </g>
</svg>
<text x="600" y="455" text-anchor="middle" font-family="Montserrat, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="110" font-weight="700" fill="#f8fafc">Vabbit</text>
<text x="600" y="512" text-anchor="middle" font-family="Montserrat, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#cbd5e1">Sleek. Fast. Secure. The WireGuard rabbit.</text>
</svg>
